<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Manage your listings and booking requests on RentX.">
<title>Owner dashboard — RentX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar"><div id="nav-mount"></div></header>

<div class="dash-shell">
  <aside class="dash-side">
    <div class="side-title">Owner</div>
    <a href="#listings" class="side-link active" data-section="listings">My listings</a>
    <a href="#requests" class="side-link" data-section="requests">Booking requests</a>
    <a href="index.html" class="side-link" style="margin-top:16px;">&larr; Browse listings</a>
  </aside>

  <main class="dash-main">
    <div class="dash-header">
      <div>
        <h1 id="page-title">My listings</h1>
        <p id="page-sub">Items you've listed for rent nearby.</p>
      </div>
      <button class="btn btn-primary" id="add-listing-btn">List a new item</button>
    </div>

    <div class="stat-row" id="stat-row"></div>

    <section id="section-listings">
      <div class="panel">
        <div class="panel-head"><h2>Your items</h2></div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Item</th><th>Category</th><th>Price/day</th><th>Status</th><th></th></tr></thead>
            <tbody id="listings-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="section-requests" class="hidden">
      <div class="panel">
        <div class="panel-head"><h2>Requests from renters</h2></div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Item</th><th>Renter</th><th>Dates</th><th>Total</th><th>Status</th><th></th></tr></thead>
            <tbody id="requests-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="listing-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 class="mt-0" id="listing-modal-title">List a new item</h3>
      <button class="modal-close" id="listing-modal-close">&times;</button>
    </div>
    <div class="form-error" id="listing-error"></div>
    <form id="listing-form">
      <input type="hidden" id="listing-id">
      <div class="form-group">
        <label for="l-title">Title</label>
        <input type="text" id="l-title" required placeholder="e.g. Cordless drill kit">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="l-category">Category</label>
          <select id="l-category" required></select>
        </div>
        <div class="form-group">
          <label for="l-price">Price per day (₹)</label>
          <input type="number" id="l-price" min="10" required>
        </div>
      </div>
      <div class="form-group">
        <label for="l-area">Pickup area</label>
        <input type="text" id="l-area" required placeholder="e.g. Andheri West">
      </div>
      <div class="form-group">
        <label for="l-desc">Description</label>
        <textarea id="l-desc" rows="4" required placeholder="Condition, what's included, any pickup notes..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="listing-submit">Publish listing</button>
    </form>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script src="js/owner.js"></script>
</body>
</html>
